name: "Flow Meters"
version: "0.2.9"
slug: "flow_meters"
description: "GPIO pulse-counting water flow meters (City, Cistern, House, Fill-Cistern) published to MQTT"
url: "https://github.com/yo1dog/rpi-flow-meters"
# Pre-built on the Mac (via colima) and pushed to ghcr.io, rather than
# built on-device: the Pi 3 B+'s 1GB RAM struggled with local builds, AND
# separately there was a real Dockerfile bug (rpi-lgpio needs swig +
# libgpio built from source, neither in the original Dockerfile) — fixed
# there too, so an on-device build would likely work now, but this way
# every future update is an instant pull instead of a build.
image: "ghcr.io/radiobillm/flow-meters-addon"
arch:
  - aarch64
init: false
gpio: true
devices:
  - "/dev/i2c-1:/dev/i2c-1:rwm"
startup: services
boot: auto
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  debounce_ms: 20
  publish_interval_s: 5
  # Adafruit i2c 16x2 RGB LCD Pi Plate. Display is flow-driven (see
  # lcd_ui.py): "No flow" when all sensors are quiet; the 1-2 currently
  # flowing sensors shown directly, one per row; with 3-4 flowing it
  # scrolls two at a time every SCROLL_INTERVAL_S (2s). UP/DOWN buttons
  # still manually page through the two old fixed pairs (City/Cistern,
  # House/Fill-Cistern) for a diagnostic look regardless of flow state,
  # pausing the auto display for AUTO_FOLLOW_IDLE_S (10s) after a press.
  # Needs I2C wired (SDA=GPIO2/pin3, SCL=GPIO3/pin5 — untouched by the
  # flow sensor pins).
  # Blinka/adafruit_character_lcd deps + /dev/i2c-1 device mapping added
  # back 2026-08-31 now that the plate is seated and the core system is
  # proven. The plate gets I2C/power/buttons automatically by being seated
  # on the 40-pin header — no separate wiring needed for the display itself.
  enable_lcd: true
  lcd_color: "red"
  lcd_refresh_s: 0.5
  button_poll_s: 0.05
  # ml_per_pulse default of 9.26 = 1000mL / 108 pulses/liter, per the
  # YF-DN32-S-SM (stainless) datasheet. UNVERIFIED for your actual unit —
  # confirm with a timed-fill test against the raw Pulse Count entity
  # before trusting Flow Rate / Total Volume. A plastic-body DN32 variant
  # has been seen published at ~27 pulses/liter (37 mL/pulse) instead.
  # GPIO pins revised 2026-09-02 for a contiguous physical run on pins
  # 31/33/35/37/39 (signal/signal/signal/signal/GND, one straight row) —
  # the case's height limits the header to a flat under-hat solder tap
  # rather than a stacking connector, so a clean contiguous block outside
  # the hat's footprint (pins 27+) mattered more than which specific GPIO
  # numbers were used. Sensor-to-pin assignment below matches Bill's ACTUAL
  # physical wiring (confirmed against his own pin labels, not a guessed
  # City/Cistern/House/Fill-Cistern order) — see hq-water-rpi-mqtt-pivot
  # memory for the full pin plan including the new ADS1115/AquaPlumb
  # water-level sensor (separate from this add-on for now).
  sensors:
    - name: "House"
      gpio: 6
      ml_per_pulse: 9.26
    - name: "Fill-Cistern"
      gpio: 13
      ml_per_pulse: 9.26
    - name: "City"
      gpio: 19
      ml_per_pulse: 9.26
    - name: "Cistern"
      gpio: 26
      ml_per_pulse: 9.26
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  debounce_ms: int(1,200)
  publish_interval_s: int(1,60)
  enable_lcd: bool
  lcd_color: "list(red|green|blue|yellow|cyan|magenta|white|off)"
  lcd_refresh_s: float
  button_poll_s: float
  sensors:
    - name: str
      gpio: int(2,27)
      ml_per_pulse: float
